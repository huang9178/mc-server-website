<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥔 正宗土豆服务器 - 桌面管理工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .title { font-size: 24px; font-weight: bold; color: #00d4ff; }
        .status { font-size: 16px; padding: 8px 20px; border-radius: 20px; }
        .status.online { background: #00b894; }
        .status.offline { background: #e74c3c; }
        .status.checking { background: #f39c12; }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(0); }
        .btn-start { background: #00b894; }
        .btn-stop { background: #e74c3c; }
        .btn-restart { background: #f39c12; }
        .btn-backup { background: #9b59b6; }
        .btn-ai { background: #3498db; }
        .btn-settings { background: #636e72; }
        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .card-label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .card-value { font-size: 28px; font-weight: bold; color: #00d4ff; }
        .log-section {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .log-title { font-size: 16px; margin-bottom: 10px; color: #00d4ff; }
        .log-box {
            background: #0d0d1a;
            color: #00ff00;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            padding: 15px;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .cmd-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .cmd-input {
            flex: 1;
            padding: 12px;
            background: #0d0d1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .cmd-input:focus { outline: none; border-color: #00d4ff; }
        .cmd-btn {
            padding: 12px 30px;
            background: #00b894;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .footer {
            text-align: center;
            color: #666;
            font-size: 12px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
        }
        .modal-content h3 { margin-bottom: 20px; color: #00d4ff; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            background: #0d0d1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 15px;
        }
        .modal-content button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🥔 正宗土豆服务器 - 桌面管理工具</div>
            <div class="status checking" id="status">● 检查中...</div>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="startServer()">▶ 启动服务器</button>
            <button class="btn btn-stop" onclick="stopServer()">⏹ 停止服务器</button>
            <button class="btn btn-restart" onclick="restartServer()">🔄 智能重启</button>
            <button class="btn btn-backup" onclick="backupServer()">📦 备份数据</button>
            <button class="btn btn-ai" onclick="aiOptimize()">🤖 AI优化</button>
            <button class="btn btn-settings" onclick="showSettings()">⚙️ 设置</button>
        </div>

        <div class="info-cards">
            <div class="card">
                <div class="card-label">👥 在线玩家</div>
                <div class="card-value" id="players">--</div>
            </div>
            <div class="card">
                <div class="card-label">💻 CPU</div>
                <div class="card-value" id="cpu">--</div>
            </div>
            <div class="card">
                <div class="card-label">💾 内存</div>
                <div class="card-value" id="memory">--</div>
            </div>
            <div class="card">
                <div class="card-label">⏱ 运行时间</div>
                <div class="card-value" id="uptime">--</div>
            </div>
        </div>

        <div class="log-section">
            <div class="log-title">📜 服务器日志</div>
            <div class="log-box" id="logBox">加载中...</div>
        </div>

        <div class="cmd-section">
            <input type="text" class="cmd-input" id="cmdInput" placeholder="输入控制台指令，按回车发送..." onkeypress="if(event.key==='Enter')sendCommand()">
            <button class="cmd-btn" onclick="sendCommand()">发送</button>
        </div>

        <div class="footer">
            API地址: <span id="apiUrl">http://tudoumc.fucku.top:56768</span> | 正宗土豆服务器管理工具 v1.0
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>⚙️ 设置</h3>
            <input type="text" id="apiInput" placeholder="API地址">
            <button style="background:#00b894;color:#fff" onclick="saveSettings()">保存</button>
            <button style="background:#636e72;color:#fff" onclick="hideSettings()">取消</button>
        </div>
    </div>

    <script>
        let API_BASE = localStorage.getItem('api_base') || 'http://tudoumc.fucku.top:56768';
        const API_KEY = 'mc-admin-2024-key';

        document.getElementById('apiUrl').textContent = API_BASE;

        async function apiRequest(endpoint, method='GET', data=null) {
            try {
                const url = API_BASE + endpoint;
                const headers = {'X-API-Key': API_KEY, 'Content-Type': 'application/json'};
                const opts = { method, headers };
                if (data) opts.body = JSON.stringify(data);
                const resp = await fetch(url, opts);
                return await resp.json();
            } catch(e) {
                return { success: false, message: e.message };
            }
        }

        async function refreshStatus() {
            try {
                const result = await apiRequest('/api/status');
                const statusEl = document.getElementById('status');
                if (result.running) {
                    statusEl.textContent = '● 运行中';
                    statusEl.className = 'status online';
                    document.getElementById('players').textContent = result.players || 0;
                    document.getElementById('cpu').textContent = result.system?.cpu || '--';
                    document.getElementById('memory').textContent = result.system?.mem_percent || '--';
                } else {
                    statusEl.textContent = '● 已停止';
                    statusEl.className = 'status offline';
                }
            } catch(e) {
                document.getElementById('status').textContent = '● 连接失败';
                document.getElementById('status').className = 'status checking';
            }
        }

        async function refreshLogs() {
            try {
                const result = await apiRequest('/api/logs');
                if (result.success) {
                    document.getElementById('logBox').textContent = result.logs || '暂无日志';
                }
            } catch(e) {}
        }

        async function startServer() {
            const result = await apiRequest('/api/start', 'POST');
            alert(result.message || '操作完成');
        }

        async function stopServer() {
            if (confirm('确定要停止服务器吗？')) {
                const result = await apiRequest('/api/stop', 'POST');
                alert(result.message || '操作完成');
            }
        }

        async function restartServer() {
            if (confirm('确定要智能重启服务器吗？')) {
                const result = await apiRequest('/api/smart-action', 'POST', {action: 'restart'});
                alert(result.message || '操作完成');
            }
        }

        async function backupServer() {
            const result = await apiRequest('/api/backup', 'POST');
            alert(result.message || '操作完成');
        }

        async function aiOptimize() {
            const result = await apiRequest('/api/smart-action', 'POST', {action: 'clean-logs'});
            alert('AI优化完成！\n\n' + (result.message || ''));
        }

        async function sendCommand() {
            const cmd = document.getElementById('cmdInput').value.trim();
            if (!cmd) return;
            await apiRequest('/api/command', 'POST', {command: cmd});
            document.getElementById('cmdInput').value = '';
            document.getElementById('logBox').textContent += '> ' + cmd + '\n';
        }

        function showSettings() {
            document.getElementById('apiInput').value = API_BASE;
            document.getElementById('settingsModal').classList.add('active');
        }

        function hideSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            API_BASE = document.getElementById('apiInput').value.trim().replace(/\/$/, '');
            localStorage.setItem('api_base', API_BASE);
            document.getElementById('apiUrl').textContent = API_BASE;
            hideSettings();
            alert('设置已保存！');
        }

        // 自动刷新
        setInterval(refreshStatus, 5000);
        setInterval(refreshLogs, 3000);
        refreshStatus();
        refreshLogs();
    </script>
</body>
</html>
